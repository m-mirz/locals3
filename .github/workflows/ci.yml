name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Verify formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...
      - name: Test with the race detector
        run: go test -race -count=1 ./...
      - name: Fuzz the key-to-path mapping
        run: go test -run FuzzKeyPath -fuzz FuzzKeyPath -fuzztime 20s ./internal/store/
